spring.application.name=qbonita-api

# MySQL — ajuste usuário/senha se necessário (Docker Compose usa root/root)
spring.datasource.url=jdbc:mysql://localhost:3306/qbonita?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
# Schema e dados iniciais: execute database/init.sql no MySQL antes de subir a API.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (mínimo 32 caracteres para HS256)
app.jwt.secret=qbonita-dev-secret-change-me-32chars-minimum!!
app.jwt.expiration-ms=86400000

server.port=8080
